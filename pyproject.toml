[project]
name = "exp-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.0.0",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "geopandas>=1.1.2",
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.3",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.0",
    "langchain-openai>=1.1.9",
    "notebook>=7.5.3",
    "pandas<3",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.46",
    "streamlit>=1.35.0",
    "streamlit-extras>=0.7.8",
    "streamlit-folium>=0.26.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["charity_watch_streamlit"]
