[project]
name = "exp-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.0.0",
    "dotenv>=0.9.9",
    "folium>=0.20.0",
    "notebook>=7.5.3",
    "pandas<3",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "streamlit>=1.35.0",
    "streamlit-folium>=0.26.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["charity_watch_streamlit"]